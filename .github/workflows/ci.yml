name: specification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui-kit: ${{ steps.filter.outputs.ui-kit }}
      lean: ${{ steps.filter.outputs.lean }}
      schema: ${{ steps.filter.outputs.schema }}
      go: ${{ steps.filter.outputs.go }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            ui-kit:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'ui-kit/**'
              - 'implementations/go/example/ui/**'
              - 'Test/programs/**'
              - '!**/*.md'
            lean:
              - '.github/workflows/ci.yml'
              - '**/*.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'bin/test'
              - 'Test/programs/**'
              - '!Test/{Schema,SchemaMain}.lean'
              - '!**/*.md'
            schema:
              - '.github/workflows/ci.yml'
              - 'Main.lean'
              - 'Suimon/**'
              - '!Suimon/Theorems/**'
              - 'Test/{Schema,SchemaMain,Validate,Trace}.lean'
              - 'Test/programs/**'
              - 'schema/**'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'bin/test'
              - '!**/*.md'
            go:
              - '.github/workflows/ci.yml'
              - 'implementations/go/**/*.go'
              - 'implementations/go/src/testdata/**'
              - 'implementations/go/go.mod'
              - 'implementations/go/go.sum'
              - 'Test/programs/**'
              - 'bin/test-go'
              - '!**/*.md'
            conformance:
              - '.github/workflows/ci.yml'
              - 'Main.lean'
              - 'Suimon/**'
              - '!Suimon/Theorems/**'
              - 'Test/programs/**'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'implementations/go/src/**'
              - 'implementations/go/cmd/**'
              - 'implementations/go/go.mod'
              - 'implementations/go/go.sum'
              - 'bin/test-go'
              - '!**/*.md'
  ui-kit:
    needs: changes
    if: needs.changes.outputs.ui-kit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
  lean:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove and test Lean
        run: bin/test lean
  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Validate schemas and serialized artifacts
        run: bin/test schema
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: implementations/go/go.mod
          cache: false
      - name: Test, race-check, and vet Go
        run: bin/test-go unit
  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: implementations/go/go.mod
          cache: false
      - name: Install Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean CLI
        run: lake build suimon
      - name: Compare Go with the Lean reference
        run: bin/test-go conformance
